  <title>علم المملكة الأردنية الهاشمية</title>
  <!-- Drawn from the Constitution of Jordan, Article 4: length twice the width; three equal stripes, black, white,
       green; a red triangle at the hoist, its base the width and its height half the length; a white seven-pointed
